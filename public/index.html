<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Institutional Web Services Gateway</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f6f9; 
            color: #333333; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            width: 90%; 
            max-width: 650px; 
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e1e4e8;
        }
        h1 { 
            margin-top: 0;
            margin-bottom: 8px; 
            font-size: 28px;
            font-weight: 600; 
            color: #1a1a1a; 
        }
        p {
            color: #666666;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .search-box { 
            display: flex; 
            border: 1px solid #ced4da;
            border-radius: 6px; 
            overflow: hidden; 
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box:focus-within {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
        }
        input { 
            flex: 1; 
            padding: 16px; 
            border: none; 
            outline: none; 
            font-size: 16px; 
            background-color: #ffffff; 
            color: #333333; 
        }
        input::placeholder {
            color: #999999;
        }
        button { 
            padding: 16px 32px; 
            border: none; 
            background-color: #0066cc; 
            color: #ffffff; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background-color 0.2s;
        }
        button:hover { 
            background-color: #0052a3; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Microsoft Instituional Web Services Gateway</h1>
        <p>Establish a connection to the database</p>
        <div class="search-box">
            <input type="text" id="urlInput" placeholder="Enter user API key" onkeydown="if(event.key==='Enter') launchProxy()">
            <button onclick="launchProxy()">Connect</button>
        </div>
    </div>
    <script>
        function launchProxy() {
            let url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            window.location.href = '/proxy/' + url;
        }
    </script>
</body>
</html>
