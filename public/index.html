<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Institutional Web Services</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; width: 90%; max-width: 600px; }
        h1 { margin-bottom: 20px; font-weight: 500; color: #00d4b2; }
        .search-box { display: flex; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden; }
        input { flex: 1; padding: 16px; border: none; outline: none; font-size: 16px; background-color: #1e1e1e; color: #fff; }
        button { padding: 16px 24px; border: none; background-color: #00d4b2; color: #121212; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #00b395; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Microsoft Institutional Web Services</h1>
        <div class="search-box">
            <input type="text" id="urlInput" placeholder="Navigate the content delivery platform" onkeydown="if(event.key==='Enter') launchProxy()">
            <button onclick="launchProxy()">Go</button>
        </div>
    </div>
    <script>
        function launchProxy() {
            let url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            // Seamlessly hands off the URL to your existing Netlify Edge function
            window.location.href = '/proxy/' + url;
        }
    </script>
</body>
</html>
